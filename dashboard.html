<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Centro de Controle Operacional — Fixar Soluções</title>
<style>
/* ============================== TOKENS ============================== */
:root{
  --r:10px; --r-sm:6px;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --t:.16s cubic-bezier(.4,0,.2,1);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d0d0d; --surface:#1a1a19; --surface-2:#232322; --surface-3:#2c2c2a;
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --border-2:rgba(255,255,255,.16);
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#9085e9;
  --accent:#3987e5; --accent-soft:rgba(57,135,229,.14);
  --marca:#C2231D; --marca-esc:#76180E; --marca-ink:#F0F0EE;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.35);
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f1f1ee; --surface:#fcfcfb; --surface-2:#f4f4f1; --surface-3:#e9e8e3;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#797771;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.12); --border-2:rgba(11,11,11,.20);
  --good:#0a8a0a; --warn:#b47c00; --serious:#c9603a; --crit:#c22f2f;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#4a3aa7;
  --accent:#2a78d6; --accent-soft:rgba(42,120,214,.10);
  --marca:#C2231D; --marca-esc:#76180E; --marca-ink:#3C3C3A;
  --shadow:0 1px 2px rgba(11,11,11,.06), 0 6px 20px rgba(11,11,11,.08);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:13px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:var(--axis)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ============================== LAYOUT ============================== */
.app{display:grid;grid-template-columns:186px 1fr;grid-template-rows:auto 1fr auto;
     grid-template-areas:"brand top" "nav main" "nav foot";height:100vh}

/* --- brand + topbar --- */
.brand{grid-area:brand;background:var(--surface);border-right:1px solid var(--border);
  border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px;padding:0 14px;height:56px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:#fff;color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;letter-spacing:-.5px;
  overflow:hidden;box-shadow:0 0 0 1px var(--border)}
.brand-mark img{width:100%;height:100%;object-fit:contain;display:block}
.brand-name{font-weight:700;font-size:13px;letter-spacing:.2px;line-height:1.1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:9px;color:var(--muted);letter-spacing:1.4px;text-transform:uppercase}

.topbar::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;
  background:linear-gradient(90deg,var(--marca-esc),var(--marca) 55%,var(--marca-esc))}
.topbar{grid-area:top;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:14px;padding:0 16px;height:56px;position:relative;overflow:hidden}
.topbar::after{content:"";position:absolute;right:0;top:0;bottom:0;width:280px;
  background:linear-gradient(100deg,transparent,var(--accent-soft));pointer-events:none}
.top-title{font-size:16px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;line-height:1.1}
.top-title em{font-style:normal;color:var(--marca)}
.top-sub{font-size:9.5px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px;z-index:1}
.chip{display:flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:6px 10px;white-space:nowrap}
.chip-l{font-size:9px;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;line-height:1.1}
.chip-v{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.iconbtn{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);
  width:32px;height:32px;display:grid;place-items:center;cursor:pointer;transition:var(--t);color:var(--ink-2)}
.iconbtn:hover{background:var(--surface-3);color:var(--ink);border-color:var(--border-2)}
.menu-toggle{display:none}

/* --- sidebar --- */
.nav{grid-area:nav;background:var(--surface);border-right:1px solid var(--border);
  overflow-y:auto;display:flex;flex-direction:column;padding:8px 0}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 14px;cursor:pointer;
  border-left:3px solid transparent;color:var(--ink-2);transition:var(--t);
  font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;font-weight:600;background:none;border-top:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.nav-item svg{width:15px;height:15px;flex:none;opacity:.75}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item[aria-current="page"]{background:var(--accent-soft);color:var(--ink);border-left-color:var(--accent)}
.nav-item[aria-current="page"] svg{opacity:1;color:var(--accent)}
.nav-badge{margin-left:auto;background:var(--crit);color:#fff;border-radius:20px;
  font-size:9.5px;padding:1px 6px;font-weight:700;font-variant-numeric:tabular-nums}
.nav-foot{margin-top:auto;padding:12px 14px;border-top:1px solid var(--border)}
.nav-foot p{margin:0;font-size:9.5px;color:var(--muted);line-height:1.5}

/* --- main --- */
.main{grid-area:main;overflow-y:auto;padding:12px;scroll-behavior:smooth}
.foot{grid-area:foot;background:var(--surface);border-top:1px solid var(--border);
  display:flex;align-items:center;gap:6px;padding:0 12px;height:40px;overflow-x:auto}
.foot-label{display:flex;align-items:center;gap:6px;color:var(--crit);font-weight:800;
  font-size:10.5px;letter-spacing:1px;text-transform:uppercase;padding-right:10px;
  border-right:1px solid var(--border);margin-right:6px;white-space:nowrap}
.foot-item{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink-2);
  white-space:nowrap;padding:4px 10px;border-radius:20px;background:var(--surface-2);cursor:pointer;
  border:1px solid transparent;transition:var(--t)}
.foot-item:hover{border-color:var(--border-2);color:var(--ink)}
.foot-item b{font-variant-numeric:tabular-nums;font-size:12px}

/* ============================== CARDS ============================== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--border);
  background:var(--surface-2)}
.card-t{font-size:10.5px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase}
.card-s{font-size:9.5px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
.card-h .right{margin-left:auto;display:flex;align-items:center;gap:6px}
.card-b{padding:11px 12px;flex:1;min-height:0}
.card-f{padding:8px 12px;border-top:1px solid var(--border)}

.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:10px}
.kpi{display:flex;align-items:center;gap:11px;padding:11px 13px}
.kpi-ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none}
.kpi-ic svg{width:17px;height:17px}
.kpi-l{font-size:9.5px;color:var(--muted);letter-spacing:.9px;text-transform:uppercase;line-height:1.2}
.kpi-v{font-size:20px;font-weight:800;letter-spacing:-.6px;line-height:1.15;margin-top:1px}
.kpi-v.sm{font-size:14px;letter-spacing:0}
.kpi-h{font-size:9.5px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}

.grid-main{display:grid;grid-template-columns:1.06fr .82fr .92fr;gap:10px;align-items:start}
.col{display:flex;flex-direction:column;gap:10px}

/* ============================== VEICULOS ============================== */
.veic-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.veic{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:5px;cursor:pointer;transition:var(--t);position:relative;overflow:hidden}
.veic:hover{border-color:var(--border-2);transform:translateY(-1px)}
.veic::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--st)}
.veic-top{display:flex;align-items:center;gap:4px;margin-bottom:3px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--st);flex:none}
.veic-id{font-size:9px;font-weight:800;letter-spacing:.3px}
.veic-ic{margin:2px 0;color:var(--ink-2)}
.veic-ic svg{width:20px;height:14px;display:block}
.veic-st{font-size:7.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--st);font-weight:700}
.veic-dt{font-size:7.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ============================== BARS ============================== */
.hbar{display:grid;grid-template-columns:1fr auto;gap:3px 8px;align-items:center;margin-bottom:9px}
.hbar-n{font-size:10px;font-weight:600;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar-v{font-size:10px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.hbar-tr{display:block;grid-column:1/-1;height:9px;background:var(--surface-3);border-radius:0 4px 4px 0;overflow:hidden}
.hbar-fl{display:block;height:100%;min-width:2px;border-radius:0 4px 4px 0;transition:width .5s cubic-bezier(.4,0,.2,1)}

/* ============================== TABLES ============================== */
.tbl-wrap{overflow:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:11.5px}
thead th{position:sticky;top:0;background:var(--surface-2);text-align:left;padding:8px 10px;
  font-size:9.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);font-weight:700;
  border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;z-index:2}
thead th:hover{color:var(--ink)}
thead th .ar{opacity:.55;font-size:8px;margin-left:3px}
tbody td{padding:7px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;
  letter-spacing:.5px;text-transform:uppercase;padding:2px 7px;border-radius:20px;
  background:var(--tg-bg);color:var(--tg);border:1px solid var(--tg-bd)}
.tag i{width:5px;height:5px;border-radius:50%;background:currentColor;flex:none;font-style:normal}

/* ============================== CONTROLS ============================== */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-bottom:10px}
.field{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:0 9px;height:31px}
.field svg{width:13px;height:13px;color:var(--muted);flex:none}
.field input,.field select{background:none;border:0;outline:0;font-size:11.5px;height:100%;min-width:80px}
.field select{cursor:pointer}
.field input::placeholder{color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:0 11px;height:31px;cursor:pointer;font-size:11px;font-weight:600;
  letter-spacing:.4px;transition:var(--t);white-space:nowrap;color:var(--ink-2)}
.btn:hover{background:var(--surface-2);border-color:var(--border-2);color:var(--ink)}
.btn svg{width:13px;height:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.12);color:#fff}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.sm{height:25px;padding:0 8px;font-size:10px}
.link{background:none;border:0;color:var(--accent);cursor:pointer;font-size:10.5px;font-weight:700;
  letter-spacing:.5px;text-transform:uppercase;padding:0;display:inline-flex;align-items:center;gap:5px}
.link:hover{text-decoration:underline}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:2px}
.seg button{background:none;border:0;padding:4px 9px;border-radius:4px;cursor:pointer;font-size:10px;
  font-weight:700;letter-spacing:.5px;color:var(--muted);transition:var(--t)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.2)}

/* ============================== DONUT / CHART ============================== */
.prod{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;margin-bottom:12px}
.prod-side{text-align:center}
.prod-l{font-size:8.5px;color:var(--muted);letter-spacing:.9px;text-transform:uppercase}
.prod-n{font-size:26px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.prod-u{font-size:8.5px;color:var(--muted);letter-spacing:.8px;text-transform:uppercase}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.stats3 > div{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:6px 4px}
.stats3 b{display:block;font-size:15px;font-weight:800;letter-spacing:-.4px}
.stats3 span{font-size:8px;color:var(--muted);letter-spacing:.7px;text-transform:uppercase;display:block;line-height:1.3}

.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:9px;padding-top:8px;border-top:1px solid var(--border)}
.legend span{display:flex;align-items:center;gap:5px;font-size:9px;color:var(--ink-2);letter-spacing:.4px;text-transform:uppercase}
.legend i{width:8px;height:8px;border-radius:2px;flex:none}

/* ============================== MAPA ============================== */
.mapa{display:grid;gap:3px;font-variant-numeric:tabular-nums}
.mapa-row{display:grid;gap:3px;align-items:center}
.mapa-h{font-size:8px;color:var(--muted);text-align:center;letter-spacing:.5px}
.mapa-lbl{font-size:9px;color:var(--muted);font-weight:700;text-align:center}
.cell{aspect-ratio:1;border-radius:3px;background:var(--c,var(--surface-3));cursor:pointer;
  transition:var(--t);border:1px solid transparent}
.cell:hover{transform:scale(1.16);border-color:var(--ink);z-index:2;position:relative}
.mapa-tot{font-size:9px;color:var(--ink-2);text-align:center;background:var(--surface-2);
  border-radius:3px;padding:1px 0}

/* ============================== MISC ============================== */
.mini{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)}
.mini:last-child{border-bottom:0}
.mini-l{font-size:10px;color:var(--ink-2);letter-spacing:.4px;text-transform:uppercase}
.mini-v{margin-left:auto;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.stat4{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;text-align:center}
.stat4 b{display:block;font-size:16px;font-weight:800;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.stat4 span{font-size:8px;color:var(--muted);letter-spacing:.7px;text-transform:uppercase;display:block}
.rank{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid var(--border)}
.rank:last-child{border-bottom:0}
.rank-p{width:19px;height:19px;border-radius:5px;background:var(--surface-3);display:grid;place-items:center;
  font-size:9.5px;font-weight:800;flex:none}
.rank-p.top{background:var(--accent);color:#fff}
.rank-n{font-size:10.5px;font-weight:600;letter-spacing:.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-v{margin-left:auto;font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.rank-v span{font-size:8.5px;color:var(--muted);font-weight:500;margin-left:2px}

.page{display:none}
.page.on{display:block}
.page-h{display:flex;align-items:flex-end;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.page-h h1{font-size:17px;font-weight:800;letter-spacing:-.2px;margin:0}
.page-h p{margin:0;font-size:11px;color:var(--muted)}
.page-h .right{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}

.empty{max-width:760px;margin:5vh auto;text-align:center}
.drop{border:2px dashed var(--border-2);border-radius:14px;padding:34px 24px;background:var(--surface);
  transition:var(--t);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop h2{margin:12px 0 6px;font-size:17px}
.drop p{margin:0 0 16px;color:var(--muted);font-size:12px}
.files{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:7px;margin-top:18px;text-align:left}
.file{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:8px 10px}
.file b{font-size:11px;display:block;font-family:ui-monospace,monospace}
.file span{font-size:9.5px;color:var(--muted)}
.file .ok{color:var(--good)}

.note{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);
  border-radius:var(--r-sm);padding:10px 12px;font-size:11.5px;color:var(--ink-2);margin-bottom:10px}
.note b{color:var(--ink)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface-2);
  border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:11px}
pre{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:10px 12px;overflow:auto;font-size:11px;margin:6px 0}

#tip{position:fixed;pointer-events:none;z-index:99;background:var(--surface);border:1px solid var(--border-2);
  border-radius:var(--r-sm);padding:7px 9px;font-size:11px;box-shadow:var(--shadow);opacity:0;
  transition:opacity .1s;max-width:250px}
#tip.on{opacity:1}
#tip b{display:block;font-size:11.5px;margin-bottom:2px}
#tip i{font-style:normal;color:var(--muted)}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;place-items:center;z-index:100;padding:16px}
.modal.on{display:grid}
.modal-box{background:var(--surface);border:1px solid var(--border-2);border-radius:14px;
  width:min(560px,100%);max-height:88vh;overflow:auto;box-shadow:var(--shadow)}
.modal-h{display:flex;align-items:center;padding:13px 16px;border-bottom:1px solid var(--border)}
.modal-h h3{margin:0;font-size:14px;font-weight:700}
.modal-b{padding:16px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:block;font-size:9.5px;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin-bottom:4px}
.form input,.form select{width:100%;background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:7px 9px;font-size:12px;outline:0}
.form input:focus,.form select:focus{border-color:var(--accent)}
.form .full{grid-column:1/-1}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--border)}

#toast{position:fixed;bottom:52px;left:50%;transform:translateX(-50%) translateY(14px);z-index:120;
  background:var(--surface);border:1px solid var(--border-2);border-left:3px solid var(--good);
  border-radius:var(--r-sm);padding:9px 14px;font-size:12px;box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:var(--t)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============================== RESPONSIVO ============================== */
@media (max-width:1400px){.grid-main{grid-template-columns:1fr 1fr}.veic-grid{grid-template-columns:repeat(6,1fr)}}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-areas:"brand" "top" "main" "foot"}
  .nav{position:fixed;top:0;left:0;bottom:0;width:210px;z-index:60;transform:translateX(-100%);
       transition:transform var(--t);box-shadow:var(--shadow)}
  .nav.on{transform:none}
  .brand{border-right:0}
  .menu-toggle{display:grid}
  .grid-main{grid-template-columns:1fr}

function parseCSV(text) {

/* ------------------------------------------------------------------ MÉTRICAS */
function statusItem(it) {
  const q = it._qtd, m = it._min;
  if (q <= 0) return 'zerado';
  if (q < m) return 'critico';
  if (q < m * 1.5) return 'baixo';
  return 'ok';
}
const ST = {
  zerado:  { txt: 'Sem estoque',   cor: 'var(--crit)'    },
  critico: { txt: 'Crítico',       cor: 'var(--serious)' },
  baixo:   { txt: 'Baixo estoque', cor: 'var(--warn)'    },
  ok:      { txt: 'Em estoque',    cor: 'var(--good)'    },
  vazio:   { txt: 'Sem cadastro',  cor: 'var(--surface-3)' },
};
const VST = {
  'OK':           { txt: 'Atualizado',   cor: 'var(--good)'    },
  'ATENCAO':      { txt: 'Atenção',      cor: 'var(--warn)'    },
  'CRITICO':      { txt: 'Crítico',      cor: 'var(--crit)'    },
  'SEM CADASTRO': { txt: 'Sem cadastro', cor: 'var(--serious)' },
};
const vst = v => VST[norm(v).toUpperCase().replace('ÇÃ', 'CA')] || VST[String(v || '').toUpperCase()] || { txt: v || '—', cor: 'var(--muted)' };

function prep() {
  DB.estoque.forEach(it => {
    it._qtd = num(it.quantidade); it._min = num(it.estoque_minimo);
    it._val = num(it.valor_unitario); it._total = it._qtd * it._val;
    it._st = statusItem(it);
  });
  DB.movimentacoes.forEach(m => { m._d = toDate(m.data); m._k = key(m._d); m._q = num(m.quantidade); m._t = String(m.tipo || '').toUpperCase(); });
  DB.producao.forEach(p => { p._d = toDate(p.data); p._k = key(p._d); p._meta = num(p.meta_diaria || p.meta); p._prod = num(p.produzidas); });
  DB.medidores.forEach(m => { m._st = String(m.status || '').toUpperCase(); m._ent = toDate(m.data_entrega); m._dev = toDate(m.data_devolucao); });
  DB.veiculos.forEach(v => { v._d = toDate(v.ultima_atualizacao); v._st = vst(v.status); });
  DB.fechamento_bases.forEach(f => {
    f._d = toDate(f.data); f._k = key(f._d); f._q = num(f.quantidade); f._meta = num(f.meta);
    f._equipes = num(f.equipes);
    f._base = String(f.base || '').toUpperCase().trim();
    f._motivo = String(f.motivo || '').trim();
  });
}

function metrics() {
  prep();
  const E = DB.estoque, MV = DB.movimentacoes, PR = DB.producao;

  /* data de referência = último dia com registro (ou hoje) */
  let ref = null;
  [...MV.map(m => m._d), ...PR.map(p => p._d), ...DB.fechamento_bases.map(f => f._d)].forEach(d => { if (d && (!ref || d > ref)) ref = d; });
  if (!ref) ref = new Date(); ref.setHours(0, 0, 0, 0);
  const refK = key(ref);
  const d7 = addDays(ref, -6), d30 = addDays(ref, -29);

  const m = { ref, refK };
  m.valorTotal = E.reduce((s, i) => s + i._total, 0);
  m.totalItens = E.length;
  m.totalUnid  = E.reduce((s, i) => s + i._qtd, 0);
  m.zerados    = E.filter(i => i._st === 'zerado').length;
  m.criticos   = E.filter(i => i._st === 'critico').length;
  m.baixos     = E.filter(i => i._st === 'baixo').length;

  /* veículos */
  m.veiculos = DB.veiculos;
  m.veicOk   = DB.veiculos.filter(v => v._st === VST['OK']).length;
  m.veicSem  = DB.veiculos.filter(v => v._st === VST['SEM CADASTRO']).length;
  m.veicAlerta = DB.veiculos.length - m.veicOk - m.veicSem;

  /* produção */
  m.produtos = [...new Set(PR.map(p => p.produto).filter(Boolean))];
  const prod = CFG.produto && m.produtos.includes(CFG.produto) ? CFG.produto : m.produtos[0] || '';
  m.produto = prod;
  const pp = PR.filter(p => p.produto === prod);
  const hoje = pp.filter(p => p._k === refK);
  m.metaDia = hoje.reduce((s, p) => s + p._meta, 0) || (pp.length ? pp[pp.length - 1]._meta : 0);
  m.prodDia = hoje.reduce((s, p) => s + p._prod, 0);
  m.pctMeta = m.metaDia ? Math.round(m.prodDia / m.metaDia * 100) : 0;
  m.serie7 = [];
  for (let i = 6; i >= 0; i--) {
    const d = addDays(ref, -i), k = key(d);
    const r = pp.filter(p => p._k === k);
    m.serie7.push({ d, label: fmtDs(d), value: r.reduce((s, p) => s + p._prod, 0), meta: r.reduce((s, p) => s + p._meta, 0) });
  }
  const sem = pp.filter(p => p._d >= d7), mes = pp.filter(p => p._d && p._d.getMonth() === ref.getMonth() && p._d.getFullYear() === ref.getFullYear());
  m.prodSemana = sem.reduce((s, p) => s + p._prod, 0);
  m.prodMes    = mes.reduce((s, p) => s + p._prod, 0);
  m.prodMedia  = mes.length ? Math.round(m.prodMes / new Set(mes.map(p => p._k)).size) : 0;

  /* movimentações */
  const saidas = MV.filter(x => x._t === 'SAIDA');
  m.entHoje = MV.filter(x => x._k === refK && x._t === 'ENTRADA');
  m.saiHoje = MV.filter(x => x._k === refK && x._t === 'SAIDA');
  m.devHoje = MV.filter(x => x._k === refK && x._t === 'DEVOLUCAO');
  m.qEnt = m.entHoje.reduce((s, x) => s + x._q, 0);
  m.qSai = m.saiHoje.reduce((s, x) => s + x._q, 0);
  m.qDev = m.devHoje.reduce((s, x) => s + x._q, 0);
  m.saldo = m.entHoje.length - m.saiHoje.length;

  /* consumo por material (janela configurável) */
  const jan = addDays(ref, -(CFG.diasConsumo - 1));
  const porMat = new Map();
  saidas.filter(x => x._d >= jan).forEach(x => porMat.set(x.codigo_material, (porMat.get(x.codigo_material) || 0) + x._q));
  const nomeMat = new Map(E.map(i => [i.codigo, i.material]));
  const unMat   = new Map(E.map(i => [i.codigo, i.unidade]));
  m.consumo = [...porMat.entries()].map(([c, q]) => ({ cod: c, nome: nomeMat.get(c) || c, un: unMat.get(c) || '', q }))
    .sort((a, b) => b.q - a.q);
  const topQ = m.consumo[0]?.q || 1;
  m.consumo.forEach(c => c.pct = Math.round(c.q / topQ * 100));

  /* série de 30 dias (entradas x saídas) */
  m.serie30 = [];
  for (let i = 29; i >= 0; i--) {
    const d = addDays(ref, -i), k = key(d);
    const ent = MV.filter(x => x._k === k && x._t === 'ENTRADA').reduce((s, x) => s + x._q, 0);
    const sai = MV.filter(x => x._k === k && x._t === 'SAIDA').reduce((s, x) => s + x._q, 0);
    if (ent || sai) m.serie30.push({ d, label: fmtDs(d), ent, sai });
  }

  /* equipes */
  m.equipesAtivas = DB.equipes.filter(e => norm(e.situacao) !== 'inativa').length || DB.equipes.length;
  const rk = new Map();
  saidas.filter(x => x._d && x._d.getMonth() === ref.getMonth() && x._d.getFullYear() === ref.getFullYear())
        .forEach(x => rk.set(x.equipe, (rk.get(x.equipe) || 0) + x._q));
  m.ranking = [...rk.entries()].map(([e, q]) => ({ equipe: e, q })).sort((a, b) => b.q - a.q);

  /* medidores */
  const MD = DB.medidores;
  m.medSolic = MD.length;
  m.medEntr  = MD.filter(x => x._st === 'ENTREGUE' || x._st === 'DEVOLVIDO').length;
  m.medDev   = MD.filter(x => x._st === 'DEVOLVIDO').length;
  m.medPend  = MD.filter(x => x._st === 'PENDENTE').length;
  m.ferramentasAtraso = MD.filter(x => x._st === 'ENTREGUE' && x._ent && (ref - x._ent) / 864e5 > CFG.alertaDiasFerramenta).length;

  /* mapa do estoque */
  const pr = [...new Set(E.map(i => String(i.prateleira || '').toUpperCase()).filter(Boolean))].sort();
  const po = [...new Set(E.map(i => String(i.posicao || '').padStart(2, '0')).filter(x => x && x !== '00'))].sort();
  m.mapa = { prateleiras: pr, posicoes: po, cells: {} };
  pr.forEach(p => po.forEach(o => m.mapa.cells[p + o] = { itens: [], st: 'vazio' }));
  E.forEach(i => {
    const k = String(i.prateleira || '').toUpperCase() + String(i.posicao || '').padStart(2, '0');
    const c = m.mapa.cells[k]; if (!c) return;
    c.itens.push(i);
  });
  Object.values(m.mapa.cells).forEach(c => {
    if (!c.itens.length) { c.st = 'vazio'; return; }
    const n = s => c.itens.filter(i => i._st === s).length;
    c.st = n('zerado') ? 'zerado' : n('critico') ? 'critico'
         : n('baixo') >= c.itens.length / 2 ? 'baixo' : 'ok';
  });
  m.mapaTot = {}; pr.forEach(p => m.mapaTot[p] = E.filter(i => String(i.prateleira || '').toUpperCase() === p).length);

  /* alertas */
  m.alertas = [
    { k: 'zerados',  n: m.zerados,             txt: 'Materiais zerados',            cor: 'var(--crit)',    go: () => { page = 'estoque'; filtros.estoque.st = 'zerado'; } },
    { k: 'criticos', n: m.criticos,            txt: 'Materiais críticos',           cor: 'var(--serious)', go: () => { page = 'estoque'; filtros.estoque.st = 'critico'; } },
    { k: 'ferram',   n: m.ferramentasAtraso,   txt: 'Ferramentas não devolvidas',   cor: 'var(--warn)',    go: () => { page = 'medidores'; filtros.medidores.st = 'ENTREGUE'; } },
    { k: 'carros',   n: m.veicSem,             txt: 'Carros sem cadastro',          cor: 'var(--s6)',      go: () => { page = 'veiculos'; } },
  ];
  m.totalAlertas = m.alertas.reduce((s, a) => s + a.n, 0);
  return m;
}

/* ------------------------------------------------------------------ GRÁFICOS */
function donut(pct, sub) {
  const p = Math.max(0, Math.min(100, pct)), R = 46, C = 2 * Math.PI * R;
  const cor = p >= 100 ? 'var(--good)' : p >= 70 ? 'var(--s1)' : p >= 40 ? 'var(--warn)' : 'var(--crit)';
  return `<svg viewBox="0 0 120 120" width="118" height="118" role="img" aria-label="${p}% da meta">
    <circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--surface-3)" stroke-width="13"/>
    <circle cx="60" cy="60" r="${R}" fill="none" stroke="${cor}" stroke-width="13" stroke-linecap="round"
      stroke-dasharray="${(C * p / 100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 60 60)"/>
    <text x="60" y="58" text-anchor="middle" font-size="25" font-weight="800" fill="var(--ink)">${p}%</text>
    <text x="60" y="72" text-anchor="middle" font-size="8.5" letter-spacing="1" fill="var(--muted)">${esc(sub)}</text>
  </svg>`;
}

function barras(dados, { h = 132, meta = true, cor = 'var(--s1)', unidade = '' } = {}) {
  if (!dados.length) return vazio('sem dados no período');
  const W = 330, H = h, ml = 26, mb = 16, mt = 14;
  const max = Math.max(...dados.map(d => Math.max(d.value, meta ? d.meta || 0 : 0)), 1);
  const esc_ = v => H - mb - (v / max) * (H - mb - mt);
  const bw = (W - ml - 6) / dados.length, w = Math.min(bw * .62, 30);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block" role="img" aria-label="Produção diária">`;
  [0, .5, 1].forEach(f => { const y = esc_(max * f); s += `<line x1="${ml}" y1="${y}" x2="${W - 4}" y2="${y}" stroke="var(--grid)" stroke-width="1"/><text x="${ml - 5}" y="${y + 3}" text-anchor="end" font-size="7.5" fill="var(--muted)">${n0(max * f)}</text>`; });
  if (meta) { const mv = dados[dados.length - 1]?.meta || 0; if (mv) { const y = esc_(mv);
    s += `<line x1="${ml}" y1="${y}" x2="${W - 4}" y2="${y}" stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="4 3"/>`
       + `<text x="${W - 6}" y="${y - 4}" text-anchor="end" font-size="7.5" fill="var(--muted)">META ${n0(mv)}</text>`; } }
  dados.forEach((d, i) => {
    const x = ml + i * bw + (bw - w) / 2, y = esc_(d.value), hh = Math.max(H - mb - y, 2);
    const c = d.color || (i === dados.length - 1 ? 'var(--s2)' : cor);
    s += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${hh.toFixed(1)}" rx="4" fill="${c}"
        data-tip="${esc(d.label)}|${n0(d.value)} ${esc(unidade)}${d.meta ? ' · meta ' + n0(d.meta) : ''}" style="cursor:pointer"/>`;
    s += `<text x="${(x + w / 2).toFixed(1)}" y="${(y - 4).toFixed(1)}" text-anchor="middle" font-size="8" font-weight="700" fill="var(--ink-2)" stroke="var(--surface)" stroke-width="2.5" paint-order="stroke">${n0(d.value)}</text>`;
    s += `<text x="${(x + w / 2).toFixed(1)}" y="${H - 4}" text-anchor="middle" font-size="7.5" fill="var(--muted)">${esc(d.label)}</text>`;
  });
  return s + '</svg>';
}

function linhas(dados, series) {
  if (!dados.length) return vazio('sem dados');
  const W = 700, H = 190, ml = 34, mb = 20, mt = 12, mr = 6;
  const max = Math.max(1, ...dados.flatMap(d => series.map(s => d[s.k])));
  const X = i => ml + i * (W - ml - mr) / Math.max(1, dados.length - 1);
  const Y = v => H - mb - (v / max) * (H - mb - mt);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block" role="img" aria-label="Entradas e saídas">`;
  [0, .25, .5, .75, 1].forEach(f => { const y = Y(max * f); s += `<line x1="${ml}" y1="${y}" x2="${W - mr}" y2="${y}" stroke="var(--grid)"/><text x="${ml - 5}" y="${y + 3}" text-anchor="end" font-size="8" fill="var(--muted)">${n0(max * f)}</text>`; });
  series.forEach(se => {
    const pts = dados.map((d, i) => `${X(i).toFixed(1)},${Y(d[se.k]).toFixed(1)}`).join(' ');
    s += `<polyline points="${pts}" fill="none" stroke="${se.cor}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  dados.forEach((d, i) => {
    if (i % 5 === 0 || i === dados.length - 1) s += `<text x="${X(i).toFixed(1)}" y="${H - 5}" text-anchor="middle" font-size="8" fill="var(--muted)">${esc(d.label)}</text>`;
    s += `<rect x="${(X(i) - 6).toFixed(1)}" y="${mt}" width="12" height="${H - mb - mt}" fill="transparent" style="cursor:pointer"
       data-tip="${esc(d.label)}|${series.map(se => se.nome + ': ' + n0(d[se.k])).join(' · ')}"/>`;
    series.forEach(se => { s += `<circle cx="${X(i).toFixed(1)}" cy="${Y(d[se.k]).toFixed(1)}" r="2.6" fill="${se.cor}" stroke="var(--surface)" stroke-width="1.5"/>`; });
  });
  return s + '</svg>';
}

function tabela(id, cols, rows, { max = 400 } = {}) {
  const f = filtros[id];
  const s = [...rows].sort((a, b) => {
    const c = cols.find(c => c.k === f.ord) || cols[0];
    let x = c.sort ? c.sort(a) : a[c.k], y = c.sort ? c.sort(b) : b[c.k];
    if (typeof x === 'string') { x = norm(x); y = norm(y); }
    return (x > y ? 1 : x < y ? -1 : 0) * f.dir;
  });
  const vis = s.slice(0, max);
  return `<div class="tbl-wrap" style="max-height:calc(100vh - 250px)">
  <table><thead><tr>${cols.map(c => `<th data-sort="${id}:${c.k}" class="${c.num ? 'num' : ''}">${esc(c.t)}${f.ord === c.k ? `<span class="ar">${f.dir > 0 ? '▲' : '▼'}</span>` : ''}</th>`).join('')}</tr></thead>
  <tbody>${vis.map(r => `<tr>${cols.map(c => `<td class="${c.num ? 'num' : ''}">${c.r ? c.r(r) : esc(r[c.k] ?? '—')}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${cols.length}">${vazio('nenhum registro encontrado')}</td></tr>`}</tbody></table></div>
  <div style="font-size:10px;color:var(--muted);margin-top:6px">${n0(vis.length)} de ${n0(rows.length)} registros${rows.length > max ? ' (exibindo os ' + max + ' primeiros — use os filtros)' : ''}</div>`;
}

function mapaHTML(compacto) {
  const mp = M.mapa;
  if (!mp.prateleiras.length) return vazio('preencha as colunas prateleira e posicao no estoque.csv');
  const cols = mp.posicoes.length;
  const grid = `grid-template-columns:18px repeat(${cols},1fr)${compacto ? ' 24px' : ' 34px'}`;
  let h = `<div class="mapa" style="max-width:${18 + cols * (compacto ? 46 : 62) + 44}px"><div class="mapa-row" style="${grid}"><div></div>${mp.posicoes.map(p => `<div class="mapa-h">${esc(p)}</div>`).join('')}<div class="mapa-h">${compacto ? 'Σ' : 'itens'}</div></div>`;
  mp.prateleiras.forEach(p => {
    h += `<div class="mapa-row" style="${grid}"><div class="mapa-lbl">${esc(p)}</div>`;
    mp.posicoes.forEach(o => {
      const c = mp.cells[p + o], st = ST[c.st];
      const lst = c.itens.slice(0, 4).map(i => `${esc(i.material)} (${n0(i._qtd)})`).join(' · ');
      h += `<div class="cell" style="--c:${st.cor}" data-tip="Posição ${p}${o} · ${st.txt}|${c.itens.length ? n0(c.itens.length) + ' item(ns): ' + lst : 'sem itens cadastrados'}" data-mapa="${p}${o}"></div>`;
    });
    h += `<div class="mapa-tot">${n0(M.mapaTot[p] || 0)}</div></div>`;
  });
  return h + '</div>';
}

// EFEITO no saldo da EQUIPE/carro pra cada tipo de movimentação — mesma
// regra do estoque.py do bot: ENTREGA e (o legado) SAIDA somam no carro,
// USO e DEVOLUCAO tiram (uso consome, devolução volta pro almoxarifado).
const EFEITO_CARRO = { ENTREGA: 1, SAIDA: 1, USO: -1, DEVOLUCAO: -1 };

function estoquePorEquipe() {
  const saldo = {};
  DB.movimentacoes.forEach(m => {
    const efeito = EFEITO_CARRO[m._t];
    if (!efeito) return;
    const equipe = String(m.equipe || '').toUpperCase().trim();
    const codigo = String(m.codigo_material || '').toUpperCase().trim();
    if (!equipe || !codigo) return;
    saldo[equipe] = saldo[equipe] || {};
    saldo[equipe][codigo] = (saldo[equipe][codigo] || 0) + efeito * m._q;
  });
  return saldo;
}

function pgEstoqueCarro() {
  const f = filtros.estoquecarro;
  const matPorCodigo = new Map(DB.estoque.map(i => [norm(i.codigo), i]));
  const limitesPorCodigo = new Map(DB.limites_carro.map(i => [norm(i.codigo), i]));
  const saldo = estoquePorEquipe();

  let rows = [];
  Object.entries(saldo).forEach(([equipe, itens]) => {
    Object.entries(itens).forEach(([codigo, qtd]) => {
      if (qtd === 0) return;
      const mat = matPorCodigo.get(norm(codigo));
      const lim = limitesPorCodigo.get(norm(codigo));
      rows.push({
        equipe, codigo, qtd,
        material: mat ? mat.material : (lim ? lim.material : '(material não encontrado no estoque)'),
        unidade: mat ? mat.unidade : '',
        minCarro: lim ? num(lim.minimo_carro) : 0,
        maxCarro: lim ? num(lim.maximo_carro) : 0,
      });
    });
  });

  const equipes = [...new Set(rows.map(r => r.equipe))].sort();
  if (f.q) { const q = norm(f.q); rows = rows.filter(r => norm(r.equipe + r.codigo + r.material).includes(q)); }
  if (f.equipe) rows = rows.filter(r => r.equipe === f.equipe);

  const foraFaixa = rows.filter(r => (r.minCarro && r.qtd < r.minCarro) || (r.maxCarro && r.qtd > r.maxCarro));

  return `${cab('Estoque por equipe', `${n0(equipes.length)} equipe(s) com material em carro · ${n0(rows.length)} item(ns)`)}
  <div class="bar">
    ${campo('busca', 'f-estoquecarro-q', 'Buscar equipe, material ou código…', f.q)}
    ${select('f-estoquecarro-equipe', [['', 'Todas as equipes'], ...equipes.map(e => [e, e])], f.equipe)}
  </div>
  ${foraFaixa.length ? `<div class="card warnbox"><div class="card-b">
    <span style="color:var(--warn)">${svg(I.alertas, 15)}</span>
    <b>${n0(foraFaixa.length)} item(ns) fora da faixa configurada (mínimo/máximo do carro).</b>
  </div></div>` : ''}
  ${tabela('estoquecarro', [
    { k: 'equipe', t: 'Equipe' },
    { k: 'codigo', t: 'Código' },
    { k: 'material', t: 'Material' },
    { k: 'qtd', t: 'Quantidade', num: 1, r: r => `<b>${n0(r.qtd)}</b> <span style="color:var(--muted)">${esc(r.unidade || '')}</span>` },
    { k: 'minCarro', t: 'Mín. carro', num: 1, r: r => r.minCarro ? n0(r.minCarro) : '—' },
    { k: 'maxCarro', t: 'Máx. carro', num: 1, r: r => r.maxCarro ? n0(r.maxCarro) : '—' },
    { k: 'faixa', t: 'Faixa', r: r => r.minCarro && r.qtd < r.minCarro ? tag('abaixo do mínimo', 'var(--warn)')
        : r.maxCarro && r.qtd > r.maxCarro ? tag('acima do máximo', 'var(--s1)') : tag('ok', 'var(--good)') },
  ], rows)}
  <div style="margin-top:10px;font-size:10px;color:var(--muted);text-align:center">Calculado a partir do histórico de movimentações (entrega, uso, devolução) — não é uma coluna guardada na planilha.</div>`;
}

function pgFechamento() {
  const m = M;
  const bases = [...new Set(DB.fechamento_bases.map(f => f._base))].filter(Boolean).sort();
  const cores = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)', 'var(--s6)'];
  const corBase = new Map(bases.map((b, i) => [b, cores[i % cores.length]]));

  const d30 = addDays(m.ref, -29);
  const noPeriodo = DB.fechamento_bases.filter(f => f._d && f._d >= d30);
  const hoje = DB.fechamento_bases.filter(f => f._k === m.refK);
  const baseHoje = new Set(hoje.map(f => f._base));
  const semHoje = bases.filter(b => !baseHoje.has(b));
  const comMotivo30 = noPeriodo.filter(f => f._motivo);
  const totalHoje = hoje.reduce((s, f) => s + f._q, 0);
  const totalMes = DB.fechamento_bases.filter(f => f._d && f._d.getMonth() === m.ref.getMonth() && f._d.getFullYear() === m.ref.getFullYear())
    .reduce((s, f) => s + f._q, 0);

  const porBase = bases.map(b => ({
    base: b, total: noPeriodo.filter(f => f._base === b).reduce((s, f) => s + f._q, 0),
  })).sort((a, b) => b.total - a.total);
  const topTotal = porBase[0]?.total || 1;

  const f = filtros.fechamento_bases;
  let rows = DB.fechamento_bases;
  if (f.q) { const q = norm(f.q); rows = rows.filter(x => norm(x.base + x.motivo + x.observacao + x.gerente).includes(q)); }
  if (f.st) rows = rows.filter(x => x._base === f.st);

  return `${cab('Fechamento por base', `${bases.length} base(s) reportando · referência ${fmtD(m.ref)}`, [
      btn('exp-fechamento_bases', 'Exportar CSV', '', '<path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>')])}

  DB.medidores.filter(m => m._st === 'ENTREGUE' && m._ent && (M.ref - m._ent) / 864e5 > CFG.alertaDiasFerramenta)
    .forEach(m => its.push({ p: 3, cor: 'var(--warn)', t: 'Ferramenta não devolvida', d: `${m.numero_serie} com ${m.equipe} há ${Math.round((M.ref - m._ent) / 864e5)} dias` }));

/* ------------------------------------------------------------------ EVENTOS */
function bind() {
  document.querySelectorAll('[data-go]').forEach(n => n.onclick = e => { e.stopPropagation(); page = n.dataset.go; $('#nav').classList.remove('on'); render(); });
  document.querySelectorAll('[data-sort]').forEach(n => n.onclick = () => {
    const [id, k] = n.dataset.sort.split(':'); const f = filtros[id];
    if (f.ord === k) f.dir *= -1; else { f.ord = k; f.dir = 1; } render();
  });
  document.querySelectorAll('[data-alerta]').forEach(n => n.onclick = () => {
    const a = M.alertas.find(x => x.k === n.dataset.alerta); if (a) { a.go(); render(); }
  });
  document.querySelectorAll('[data-edit]').forEach(n => n.onclick = () => modalItem(n.dataset.edit));

  for (const id in filtros) {
    const q = $('#f-' + id + '-q'); if (q) q.oninput = deb(() => { filtros[id].q = q.value; const p = q.selectionStart; render(); const n2 = $('#f-' + id + '-q'); if (n2) { n2.focus(); n2.setSelectionRange(p, p); } });
    const st = $('#f-' + id + '-st'); if (st) st.onchange = () => { filtros[id].st = st.value; render(); };
    const ct = $('#f-' + id + '-cat'); if (ct) ct.onchange = () => { filtros[id].cat = ct.value; render(); };
    const eq = $('#f-' + id + '-equipe'); if (eq) eq.onchange = () => { filtros[id].equipe = eq.value; render(); };
  }
  const pp = $('#cfg-produto'); if (pp) pp.onchange = () => { CFG.produto = pp.value; render(); };
  ['empresa', 'sigla'].forEach(k => { const n = $('#cfg-' + k); if (n) n.oninput = () => { CFG[k] = n.value; $('#brandName').textContent = CFG.empresa; $('#brandMark').textContent = CFG.sigla; }; });
  const cd = $('#cfg-dias'); if (cd) cd.onchange = () => { CFG.diasConsumo = Math.max(1, +cd.value || 7); render(); };
  const ca = $('#cfg-alerta'); if (ca) ca.onchange = () => { CFG.alertaDiasFerramenta = Math.max(1, +ca.value || 5); render(); };

  on('#add-item', () => modalItem(null));
  on('#add-mov', modalMov);
  on('#add-prod', modalProd);
  on('#pick-file', () => $('#filePick').click());
  on('#pick-file2', () => $('#filePick').click());
  on('#exp-tudo', exportarTudo);
  on('#exp-modelos', exportarModelos);
  on('#restaurar', () => { if (carregarEmbutido()) { render(); toast('Base de demonstração restaurada'); } });
  on('#do-print', () => window.print());
  on('#exp-ranking', () => baixar('ranking.csv', ['posicao', 'equipe', 'itens'], M.ranking.map((r, i) => [i + 1, r.equipe, r.q])));
  on('#exp-alertas', () => { page = 'alertas'; baixar('alertas.csv', ['tipo', 'descricao'], [
    ...DB.estoque.filter(i => i._st === 'zerado' || i._st === 'critico').map(i => [ST[i._st].txt, `${i.material} (${i.codigo}) qtde ${i._qtd} / min ${i._min}`]),
    ...DB.veiculos.filter(v => v._st !== VST['OK']).map(v => ['Veículo ' + v._st.txt, `${v.codigo} ${v.placa}`]),
  ]); });
  Object.keys(SCHEMAS).forEach(k => on('#exp-' + k, () => exportarTabela(k)));

  const drop = $('#drop');
  if (drop) {
    drop.onclick = () => $('#filePick').click();
    drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
    drop.ondragleave = () => drop.classList.remove('over');
    drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); carregar(e.dataTransfer.files); };
  }
}
const on = (s, fn) => { const n = $(s); if (n) n.onclick = fn; };
const deb = (fn, ms = 220) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

/* tooltip global */
const tip = $('#tip');
document.addEventListener('mouseover', e => {

document.addEventListener('mousemove', e => {
  if (!tip.classList.contains('on')) return;

  tip.style.left = Math.min(e.clientX + 14, innerWidth - r.width - 8) + 'px';
  tip.style.top = Math.max(8, e.clientY - r.height - 12) + 'px';

document.addEventListener('mouseout', e => { if (e.target.closest('[data-tip]')) tip.classList.remove('on'); });

const fecharModal = () => modal.classList.remove('on');

const inp = (id, lbl, v = '', tipo = 'text', full = false) => `<div class="${full ? 'full' : ''}"><label>${esc(lbl)}</label><input id="${id}" type="${tipo}" value="${esc(v)}"></div>`;
const sel = (id, lbl, opts, v = '', full = false) => `<div class="${full ? 'full' : ''}"><label>${esc(lbl)}</label><select id="${id}">${opts.map(o => { const [a, b] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(a)}" ${a === v ? 'selected' : ''}>${esc(b)}</option>`; }).join('')}</select></div>`;

/* ------------------------------------------------------------------ TOAST */
let toastT;
function toast(msg, erro) {
  const t = $('#toast'); t.textContent = msg;
  t.style.borderLeftColor = erro ? 'var(--crit)' : 'var(--good)';
  t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600);
}

/* ------------------------------------------------------------------ IMPORT */
function carregar(files) {
  const list = [...files].filter(f => /\.(csv|txt)$/i.test(f.name));
  if (!list.length) { toast('Selecione arquivos .csv', 1); return; }
  let ok = 0, falhas = [];
  let pend = list.length;
  /* primeira importação sobre a base de demonstração: limpa tudo para não misturar */
  if (origem === 'demo') { Object.keys(DB).forEach(k => DB[k] = []); origem = ''; }
  list.forEach(f => {
    const r = new FileReader();
    r.onload = () => {
      try {
        const rows = parseCSV(r.result);
        const t = detect(rows, f.name);
        if (t) { DB[t] = rows; ok++; } else falhas.push(f.name);
      } catch (e) { falhas.push(f.name); }
      if (--pend === 0) fim();
    };
    r.onerror = () => { falhas.push(f.name); if (--pend === 0) fim(); };
    r.readAsText(f, 'utf-8');
  });
  function fim() {
    dirty = false; if (ok) origem = 'arquivo';
    if (ok && page === 'ajuda') page = 'dashboard';
    if (ok && !temDados()) page = 'dados';
    else if (ok && page !== 'dados') page = 'dashboard';
    render();
    toast(ok ? `${ok} arquivo(s) carregado(s)${falhas.length ? ' · ' + falhas.length + ' não reconhecido(s)' : ''}` : 'Nenhum arquivo reconhecido', !ok);
  }
}
$('#filePick').onchange = e => { carregar(e.target.files); e.target.value = ''; };
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer.files.length) carregar(e.dataTransfer.files); });

/* ------------------------------------------------------------------ EXPORT */
function baixar(nome, headers, rows) {
  const cel = v => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const csv = '﻿' + [headers.join(';'), ...rows.map(r => r.map(cel).join(';'))].join('\r\n');
  const a = el('a', { href: URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })), download: nome });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const COLS = {
  estoque: ['codigo', 'material', 'categoria', 'unidade', 'quantidade', 'estoque_minimo', 'valor_unitario', 'prateleira', 'posicao'],
  veiculos: ['codigo', 'placa', 'tipo', 'motorista', 'equipe', 'status', 'ultima_atualizacao', 'km_atual', 'proxima_revisao'],
  producao: ['data', 'produto', 'meta_diaria', 'produzidas', 'turno'],
  equipes: ['codigo', 'supervisor', 'regiao', 'membros', 'situacao'],
  medidores: ['numero_serie', 'modelo', 'equipe', 'status', 'data_solicitacao', 'data_entrega', 'data_devolucao'],
  movimentacoes: ['data', 'hora', 'tipo', 'codigo_material', 'quantidade', 'equipe', 'veiculo', 'responsavel'],
  fechamento_bases: ['data', 'hora', 'base', 'equipes', 'meta', 'quantidade', 'motivo', 'observacao', 'gerente'],
  limites_carro: ['codigo', 'material', 'minimo_carro', 'maximo_carro'],
};
function exportarTabela(k) {
  if (!DB[k].length) { toast('Nada para exportar em ' + k, 1); return; }
  baixar(k + '.csv', COLS[k], DB[k].map(r => COLS[k].map(c => r[c] ?? '')));
  toast(k + '.csv exportado');
}
function exportarTudo() {
  const ks = Object.keys(COLS).filter(k => DB[k].length);
  if (!ks.length) { toast('Carregue os dados primeiro', 1); return; }
  ks.forEach((k, i) => setTimeout(() => baixar(k + '.csv', COLS[k], DB[k].map(r => COLS[k].map(c => r[c] ?? ''))), i * 350));
  dirty = false; toast(`Exportando ${ks.length} arquivos…`);
}
function exportarModelos() {

}
